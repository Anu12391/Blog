{% extends 'base.html' %}
{% block title %} Forgot Password  {% endblock title %}
{% block body %}
<div class="container">
    <div class="row">

        <div class="col-8 mx-auto mt-3">
            <p class="text-center">Login Form</p>

            <form method="POST">
                  {% csrf_token %}

                {% include "components/email_field.html" with field=forgotPasswordForm.email %}

                <button type="submit" class="btn btn-primary mt-3">Forgot Password</button>

            </form>
            <div class="mt-3">
                 {% include "components/error_messages.html"%}
            </div>


        </div>
    </div>
</div>



{% endblock body %}
