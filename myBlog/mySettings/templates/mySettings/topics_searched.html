{% for topic in allTopics %}
    <div class="topic-card d-inline-flex align-items-center justify-content-center border border-danger rounded p-4 {% if topic.topicId in user_selected_ids %}selected{% endif %}"
         data-topic-id="{{ topic.topicId }}"
         onclick="toggleTopic(this)">
        <p class="text-center mb-0">
            {{ topic.topicName }}
        </p>
    </div>
{% empty %}
    <p>No topics found.</p>
{% endfor %}
