<div class="mt-2">
    <label for="{{ field.id_for_label }}" class="form-label">
        {{ label|default:field.label }}
    </label>

    <select
        name="{{ field.name }}"
        id="{{ field.id_for_label }}"
        class="form-control"
    >
        {% for widget in field %}

            {{ widget }}
        {% endfor %}
    </select>
</div>
